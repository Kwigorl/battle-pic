name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.BATTLEPIC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/battlepic.keystore"
            echo "BATTLEPIC_KEYSTORE=$RUNNER_TEMP/battlepic.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret BATTLEPIC_KEYSTORE_B64 absent : APK signé avec une clé temporaire."
          fi

      - name: Compiler l'APK
        env:
          BATTLEPIC_KEYSTORE_PASSWORD: ${{ secrets.BATTLEPIC_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk battle-pic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: battle-pic-apk
          path: battle-pic.apk

      - name: Publier dans les releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest battle-pic.apk \
            --title "Battle Pic (version ${{ github.run_number }})" \
            --notes "APK construit automatiquement à partir de la branche main." \
            --latest
