<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Battle Pic</title>
<style>
@font-face { font-family: "Anton"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/anton-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/barlow-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Urbanist"; font-weight: 900; font-style: normal; font-display: swap; src: url("fonts/urbanist-latin-900-normal.woff2") format("woff2"); }
</style>
<style>
/* Layout : appli plein écran — en-tête, cadre 4:5 du post au centre, pupitre de commandes en bas */
:root {
  --ink: #121110;      /* fond, noir légèrement chaud */
  --deck: #1d1b19;     /* pupitre, cadre vide */
  --line: #34302b;     /* filets, contours */
  --fg: #f4f2ef;       /* texte */
  --muted: #aaa39a;    /* texte secondaire */
  --orange: #f7ab03;   /* éclair */
  --red: #fc0000;      /* case VS */
  --display: "Anton", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --box: "Urbanist", "Barlow", "Helvetica Neue", Arial, sans-serif; /* police des cases du visuel */
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.4; }
button, input, label { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr); /* rien ne doit élargir la page au-delà de l'écran */
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;
}

/* En-tête */
.bar { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 560px; width: 100%; margin-inline: auto; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .eyebrow { font-family: var(--display); color: var(--orange); font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
.brand .word { font-family: var(--display); font-size: 24px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
.brand .pic { color: var(--orange); }
.chip { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.live { color: var(--fg); }
.chip.live .dot { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 30%, transparent); }

/* Cadre */
.stage { min-height: 0; container-type: size; display: grid; place-items: center; }
.frame {
  position: relative;
  width: min(100cqw, 80cqh);
  height: min(100cqh, 125cqw);
  background: var(--deck);
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 0 0 1px var(--line);
  user-select: none;
  -webkit-user-select: none;
}
.frame.editing { touch-action: none; cursor: grab; }
.frame.editing:active { cursor: grabbing; }
/* .post = le post 1080 × 1350 entier ; pendant la saisie des textes, le cadre ne montre que la bande des cases */
.post { position: absolute; left: 0; right: 0; bottom: 0; aspect-ratio: 4 / 5; }
.post > video, .post > canvas, .post > .overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.post > video { object-fit: cover; background: var(--ink); }
.post > video.mirror { transform: scaleX(-1); }
.post > .overlay, .post > .texts { pointer-events: none; -webkit-user-drag: none; }
/* quand le clavier laisse peu de place, l'aperçu se resserre sur la bande des cases */
@container (max-height: 300px) {
  .frame.boxes { width: min(100cqw, calc(100cqh * 1080 / 250)); height: min(100cqh, calc(100cqw * 250 / 1080)); }
}
.count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: min(40cqh, 48cqw); color: var(--fg); text-shadow: 0 4px 30px rgba(0, 0, 0, 0.55); pointer-events: none; }
.flash { position: absolute; inset: 0; background: var(--fg); opacity: 0; pointer-events: none; }
.flash.on { animation: flash 420ms ease-out; }
@keyframes flash { from { opacity: 0.9; } to { opacity: 0; } }

/* Pupitre */
.deck { width: 100%; max-width: 560px; min-width: 0; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.hint { margin: 0; text-align: center; color: var(--muted); font-size: 14px; text-wrap: balance; }
.row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.side { justify-self: center; display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 4px 8px; border-radius: 10px; }
.side .ico { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--deck); border: 1px solid var(--line); }
.side svg { width: 24px; height: 24px; }
.side span { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.side:hover .ico { border-color: var(--muted); }
.shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid var(--fg); background: transparent; padding: 5px; display: grid; }
.shutter::after { content: ""; border-radius: 50%; background: var(--orange); transition: transform 120ms ease; }
.shutter:active::after { transform: scale(0.88); }
.shutter:disabled { opacity: 0.5; cursor: default; }

.seg { display: flex; justify-content: center; gap: 4px; }
.seg-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.seg-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.seg button { border: 1px solid var(--line); background: var(--deck); padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }

.sliders { display: grid; grid-template-columns: auto minmax(0, 1fr) 3.2em; align-items: center; column-gap: 12px; row-gap: 6px; }
.sliders label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sliders input { width: 100%; accent-color: var(--orange); }
.sliders output { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions > * { flex: 1 1 0; min-width: 0; }
.btn { border-radius: 12px; padding: 13px 14px; font-weight: 700; font-size: 15px; border: 1px solid var(--line); background: var(--deck); }
.btn.primary { flex-grow: 2; background: var(--orange); color: var(--ink); border-color: var(--orange); }
.btn:disabled { opacity: 0.6; cursor: default; }

.pill { justify-self: center; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--deck); border-radius: 999px; padding: 7px 16px 7px 12px; font-weight: 600; font-size: 14px; }
.pill .aa { font-family: var(--box); font-weight: 900; color: var(--orange); }
.pill:hover { border-color: var(--muted); }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.field label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.field .line { display: flex; gap: 12px; align-items: center; }
.field input[type="text"] { flex: 1 1 0; width: 0; min-width: 0; background: var(--deck); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--box); font-weight: 900; font-size: 16px; text-transform: uppercase; }
.field input[type="text"]::placeholder { color: var(--muted); opacity: 0.6; }
.field .size { flex: 0 0 96px; display: grid; gap: 2px; }
.tabs { display: flex; gap: 4px; justify-content: center; }
.tabs button { flex: 1 1 0; min-width: 0; border: 1px solid var(--line); background: var(--deck); padding: 8px 10px; border-radius: 10px; font-weight: 600; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.field .size span { font-size: 11px; color: var(--muted); text-align: center; }
.field input[type="range"] { width: 100%; accent-color: var(--orange); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--ink); font-weight: 600; padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); text-align: center; opacity: 0; pointer-events: none; transition: opacity 200ms ease, transform 200ms ease; z-index: 20; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .flash.on { animation: none; }
  .toast, .shutter::after { transition: none; }
}
</style>
</head>

  <section class="deck" id="deckShoot">
    <p class="hint" id="hintShoot">Le bouton ouvre l'appareil photo. Le cadre se pose ensuite sur ta photo, que tu peux recadrer.</p>

    <div class="row">
      <button class="side" id="galleryBtn" type="button">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></span>
        <span>Galerie</span>

      <button class="side" id="flipBtn" type="button" hidden>
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg></span>

        <button type="button" data-timer="3" aria-pressed="false">3 s</button>
        <button type="button" data-timer="10" aria-pressed="false">10 s</button>
      </div>
    </div>
    <input class="vh" type="file" id="pickCamera" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
    <input class="vh" type="file" id="pickGallery" accept="image/*" tabindex="-1" aria-hidden="true">
  </section>

  <section class="deck" id="deckTexts" hidden>
    <div class="tabs" role="tablist" aria-label="Case à remplir">
      <button type="button" role="tab" id="tabLeft" aria-selected="true">Case de gauche</button>
      <button type="button" role="tab" id="tabRight" aria-selected="false">Case de droite</button>
    </div>
    <div class="field">
      <label for="txtLine1">Ligne 1</label>
      <div class="line">
        <input type="text" id="txtLine1" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next" maxlength="40">
        <div class="size"><input type="range" id="sizeLine1" min="50" max="200" step="5" value="100" aria-label="Taille de la ligne 1"><span>Taille</span></div>
      </div>
    </div>
    <div class="field">
      <label for="txtLine2">Ligne 2 (facultative)</label>
      <div class="line">
        <input type="text" id="txtLine2" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" maxlength="40">
        <div class="size"><input type="range" id="sizeLine2" min="50" max="200" step="5" value="100" aria-label="Taille de la ligne 2"><span>Taille</span></div>
      </div>

  <section class="deck" id="deckReview" hidden>
    <div class="seg-wrap">
      <span class="seg-label" id="viewLabel">Aperçu</span>
      <div class="seg" role="group" aria-labelledby="viewLabel">
        <button type="button" data-view="on" aria-pressed="true">Avec filtre</button>
        <button type="button" data-view="off" aria-pressed="false">Sans filtre</button>

      <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
      <output id="zoomOut" for="zoom">×1,0</output>
      <label for="bw">Noir et blanc</label>
      <input type="range" id="bw" min="0" max="100" step="5" value="100">
      <output id="bwOut" for="bw">100 %</output>
    </div>
    <p class="hint">Fais glisser la photo pour la recadrer, pince pour zoomer.</p>
    <button class="pill" type="button" data-open-texts><span class="aa">Aa</span><span class="lbl">Écrire dans les cases</span></button>
    <div class="actions">
      <button class="btn" id="retakeBtn" type="button">Reprendre</button>
      <button class="btn primary" id="saveBtn" type="button">Enregistrer les 2 photos</button>

    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const W = 1080, H = 1350;
  const $ = (id) => document.getElementById(id);
  const frame = $("frame"), post = $("post"), video = $("video"), photo = $("photo"), overlay = $("overlay"), vsLayer = $("vsLayer");
  const countEl = $("count"), flashEl = $("flash"), chip = $("chip"), chipText = $("chipText");
  const deckShoot = $("deckShoot"), deckReview = $("deckReview"), hintShoot = $("hintShoot");
  const shutter = $("shutter"), flipBtn = $("flipBtn"), galleryBtn = $("galleryBtn"), timerWrap = $("timerWrap");
  const pickCamera = $("pickCamera"), pickGallery = $("pickGallery");
  const zoom = $("zoom"), saveBtn = $("saveBtn"), shareBtn = $("shareBtn"), retakeBtn = $("retakeBtn");
  const toastEl = $("toast");
  const textsCanvas = $("texts"), deckTexts = $("deckTexts");
  const txtLine1 = $("txtLine1"), txtLine2 = $("txtLine2"), sizeLine1 = $("sizeLine1"), sizeLine2 = $("sizeLine2");
  const tabLeft = $("tabLeft"), tabRight = $("tabRight");
  const bwInput = $("bw"), bwOut = $("bwOut"), zoomOut = $("zoomOut");

  const inClaude = !!(window.claude && typeof window.claude.use === "function");
  const app = window.BattleApp || null; /* pont fourni par l'appli Android */
  const downloadsReady = inClaude ? Promise.resolve(window.claude.use("downloads")).catch(() => null) : Promise.resolve(null);

  let stream = null, facing = "environment", live = false, wantLive = true;
  let mode = "shoot", src = null, view = { z: 1, cx: W / 2, cy: H / 2 };
  let timer = 0, counting = false, wake = null, busy = false, savedUris = null;

  try { const t = parseInt(localStorage.getItem("battle-timer"), 10); if ([0, 3, 10].includes(t)) timer = t; } catch (e) {}

  /* ---------- Interface ---------- */
  function setChip(text, isLive) { chipText.textContent = text; chip.classList.toggle("live", !!isLive); }
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("on"), 3200);
  }
  function pressGroup(btns, attr, value) { btns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[attr] === String(value)))); }
  const timerBtns = [...timerWrap.querySelectorAll("button")];
  pressGroup(timerBtns, "timer", timer);
  timerBtns.forEach((b) => b.addEventListener("click", () => {
    timer = parseInt(b.dataset.timer, 10); pressGroup(timerBtns, "timer", timer);
    try { localStorage.setItem("battle-timer", String(timer)); } catch (e) {}
  }));
  const viewBtns = [...deckReview.querySelectorAll("[data-view]")];
  viewBtns.forEach((b) => b.addEventListener("click", () => {
    setFrameVisible(b.dataset.view !== "off"); pressGroup(viewBtns, "view", b.dataset.view);
  }));

  function setFrameVisible(on) { overlay.hidden = textsCanvas.hidden = vsLayer.hidden = !on; }

  /* ---------- Cases blanches et leurs textes ---------- */
  /* Mesures prises sur le visuel d'origine, en pixels du post 1080 × 1350.
     Une case fait 80 px de haut avec une ligne, 100 px avec deux ; son bord haut ne bouge pas.
     Ombres : foncée (70 % de noir) décalée de 10 px / 8 px, claire (20 %) décalée de 20 px / 16 px. */
  const BOXES = {
    left: { x0: 128.75, x1: 508.89, top: 1167.95 },
    right: { x0: 571.0, x1: 951.24, top: 1235.03 }
  };
  const vsLeft = (y) => -0.2558 * y + 789.62;   /* bord gauche de la case VS à la hauteur y */
  const vsRight = (y) => -0.2567 * y + 924.37;  /* bord droit */
  const BOX_SIZE = 42; /* taille du texte d'origine : capitales de ~30 px */
  const BOX_FONT = '"Urbanist", "Barlow", "Helvetica Neue", Arial, sans-serif';
  const blankTexts = () => ({ left: ["", ""], right: ["", ""], sizes: { left: [100, 100], right: [100, 100] } });
  let texts = blankTexts();
  try {
    const t = JSON.parse(localStorage.getItem("battle-texts-2") || "null");
    if (t && t.left && t.right && t.sizes) texts = t;
    else {
      const old = JSON.parse(localStorage.getItem("battle-texts") || "null");
      if (old && typeof old.left === "string") { texts.left[0] = old.left; texts.right[0] = old.right || ""; }
    }
  } catch (e) {}
  function saveTexts() { try { localStorage.setItem("battle-texts-2", JSON.stringify(texts)); } catch (e) {} }
  const linesOf = (side) => texts[side].map((t, i) => ({ text: String(t || "").toLocaleUpperCase("fr-FR").trim(), scale: (texts.sizes[side][i] || 100) / 100 })).filter((l) => l.text);

  function boxRect(side, n) { const b = BOXES[side]; return { x0: b.x0, x1: b.x1, y0: b.top, y1: b.top + (n === 2 ? 100 : 80) }; }
  /* zone blanche visible (hors case VS) à la hauteur y */
  function whiteSpan(side, y) {
    const b = BOXES[side];
    return side === "left" ? [b.x0, Math.min(b.x1, vsLeft(y))] : [Math.max(b.x0, vsRight(y)), b.x1];
  }
  function layoutSide(ctx, side) {
    const lines = linesOf(side);
    const r = boxRect(side, lines.length);
    if (!lines.length) return { r, items: [] };
    let sizes = lines.map((l) => BOX_SIZE * l.scale);
    let items = [];
    for (let pass = 0; pass < 6; pass++) {
      const caps = sizes.map((sz) => { ctx.font = `900 ${sz}px ${BOX_FONT}`; return ctx.measureText("H").actualBoundingBoxAscent || sz * 0.71; });
      const gap = lines.length === 2 ? 0.267 * (sizes[0] + sizes[1]) / 2 : 0;
      const block = caps.reduce((a, b) => a + b, 0) + gap;
      const maxH = (r.y1 - r.y0) - 16;
      if (block > maxH) { sizes = sizes.map((sz) => sz * maxH / block); continue; }
      let y = (r.y0 + r.y1) / 2 - block / 2;
      items = [];
      let changed = false;
      lines.forEach((l, i) => {
        ctx.font = `900 ${sizes[i]}px ${BOX_FONT}`;
        const w = ctx.measureText(l.text).width;
        const capTop = y, base = y + caps[i];
        /* marges : 12 px du bord de la case, quelques px du VS (à la hauteur la plus serrée de la ligne) */
        const xmin = side === "left" ? r.x0 + 12 : Math.max(r.x0 + 12, vsRight(capTop) + 4);
        const xmax = side === "left" ? Math.min(r.x1 - 12, vsLeft(base) - 6) : r.x1 - 10;
        if (w > xmax - xmin) { sizes[i] *= (xmax - xmin) / w * 0.995; changed = true; }

        let cx = (wa + wb) / 2;
        cx = Math.min(Math.max(cx, xmin + w / 2), xmax - w / 2);
        items.push({ text: l.text, size: sizes[i], x: cx, y: base });

  function fillRect(ctx, x0, y0, x1, y1) { ctx.fillRect(x0, y0, x1 - x0, y1 - y0); }

  /* ---------- Noir et blanc ---------- */
  /* Rendu calé sur la photo d'exemple : niveaux de gris (luminance Rec. 709), contraste ×1,15,
     noirs remontés vers 10, blancs plafonnés vers 235, très légère teinte froide.

  const LOOK = { contrast: 1.15, lo: [10, 11, 14], hi: [233, 235, 240] };
  const LUT = [0, 1, 2].map((c) => {
    const t = new Float32Array(256);
    for (let y = 0; y < 256; y++) {
      const v = Math.min(1, Math.max(0, (y / 255 - 0.5) * LOOK.contrast + 0.5));
      t[y] = LOOK.lo[c] + v * (LOOK.hi[c] - LOOK.lo[c]);

    const r = LUT[0], g = LUT[1], b = LUT[2];

  /* ---------- Caméra en direct ---------- */
  async function startCamera() {

  /* Copie une image dans un canevas (réduit à 3200 px max), en miroir pour la caméra avant */
  function toCanvas(img, w, h, mirror) {
    const k = Math.min(1, 3200 / Math.max(w, h));

    const x = c.getContext("2d"); x.imageSmoothingQuality = "high";

  /* Vraie photo du capteur (pleine résolution) quand le téléphone le permet */
  async function sensorPhoto(track, vw, vh) {
    if (typeof ImageCapture !== "function") return null;
    try {
      const ic = new ImageCapture(track);
      let settings;
      try {
        const caps = await ic.getPhotoCapabilities();
        if (caps && caps.imageWidth && caps.imageWidth.max && caps.imageHeight && caps.imageHeight.max) {
          settings = { imageWidth: caps.imageWidth.max, imageHeight: caps.imageHeight.max };
        }
      } catch (e) {}
      const blob = await ic.takePhoto(settings);
      const bmp = await createImageBitmap(blob);
      /* si la photo n'a pas la même orientation que le viseur, on garde l'image du viseur */
      if ((bmp.width > bmp.height) !== (vw > vh) || bmp.width < vw) { if (bmp.close) bmp.close(); return null; }
      const c = toCanvas(bmp, bmp.width, bmp.height, facing === "user");
      if (bmp.close) bmp.close();

    } catch (e) { return null; }
  }
  /* Zoom de départ pour que la photo montre le même champ que le viseur */
  function zoomMatchingPreview(pw, ph, vw, vh) {
    const va = vw / vh, fa = W / H;
    const rw = pw / ph > va ? ph * va : pw;            /* zone de la photo qui correspond au flux vidéo */
    const visW = va > fa ? vh * fa : vw;               /* largeur du flux visible dans le cadre */
    const shownW = visW * (rw / vw);                   /* … ramenée en pixels de la photo */
    const cover = Math.max(W / pw, H / ph);
    return Math.min(4, Math.max(1, (W / shownW) / cover));
  }
  async function takeLivePhoto() {

    shutter.disabled = true; setChip("Prise de vue…", true);

    shutter.disabled = false;

    if (full) setSource(full, zoomMatchingPreview(full.width, full.height, vw, vh));

  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function countdown(n) {

  shutter.addEventListener("click", async () => {

  galleryBtn.addEventListener("click", () => { pickGallery.value = ""; pickGallery.click(); });

  /* ---------- Photo importée ---------- */
  function decodeWithImg(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }
  async function loadFile(file) {

      catch (e) { bmp = await decodeWithImg(file); }
      const w = bmp.naturalWidth || bmp.width, h = bmp.naturalHeight || bmp.height;
      const k = Math.min(1, 3200 / Math.max(w, h));
      const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(bmp, 0, 0, c.width, c.height);

  /* ---------- Recadrage ---------- */
  function setSource(c, z) {

  function zoomAt(mx, my, z) {
    const old = geom().s;

  function toOut(clientX, clientY) {
    const r = post.getBoundingClientRect();
    return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height), k: W / r.width };
  }
  const pts = new Map();
  frame.addEventListener("pointerdown", (e) => {
    if (mode !== "review" || !deckTexts.hidden) return;

    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  });
  frame.addEventListener("pointermove", (e) => {

    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

  });

  retakeBtn.addEventListener("click", showShoot);

  /* ---------- Export ---------- */
  function makeBlob(withOverlay) {
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d");
    drawPhoto(x);
    if (withOverlay) { x.drawImage(overlay, 0, 0, W, H); x.drawImage(textsCanvas, 0, 0, W, H); x.drawImage(vsLayer, 0, 0, W, H); }
    return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("export"))), "image/jpeg", 0.92));
  }
  function fileNames() {
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    const stamp = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}-${p(d.getSeconds())}`;
    return { on: `la-battle_${stamp}_avec-filtre.jpg`, off: `la-battle_${stamp}_sans-filtre.jpg` };
  }
  async function saveWith(downloads, filename, data) {
    try { return await downloads.save({ filename, data }); }
    catch (e) {

      throw e;

  /* Appli Android : les 2 photos vont dans la galerie, album « La Battle » */
  async function saveInApp() {

    const [withF, withoutF] = await Promise.all([makeBlob(true), makeBlob(false)]);
    const names = fileNames();
    const u1 = app.saveImage(await blobToBase64(withF), names.on);
    if (!u1) throw new Error("save");
    const u2 = app.saveImage(await blobToBase64(withoutF), names.off);
    if (!u2) { const e = new Error("save"); e.partial = true; throw e; }
    return [u1, u2];
  }
  saveBtn.addEventListener("click", async () => {
    if (!src || busy) return;
    busy = true; saveBtn.disabled = true; const label = saveBtn.textContent; saveBtn.textContent = "Préparation…";
    let saved = 0;

      if (inClaude) {
        const downloads = await downloadsReady;
        if (!downloads) { toast("L'enregistrement n'est pas disponible sur cette page."); return; }
        saveBtn.textContent = "Photo avec filtre…";
        await saveWith(downloads, names.on, withF); saved++;
        saveBtn.textContent = "Photo sans filtre…";
        await saveWith(downloads, names.off, withoutF); saved++;
        toast("Les 2 photos sont enregistrées.");
      } else {
        linkDownload(withF, names.on); saved++;
        await wait(500);
        linkDownload(withoutF, names.off); saved++;
        toast("Les 2 photos sont dans tes téléchargements.");
      }
    } catch (e) {
      const code = e && e.code;
      if (saved === 1 || (e && e.partial)) toast("Seule la photo avec filtre a été enregistrée.");
      else if (code === "declined") toast("Enregistrement annulé.");
      else toast("L'enregistrement n'a pas abouti. Réessaie dans un instant.");
    } finally {
      busy = false; saveBtn.disabled = false; saveBtn.textContent = label;
    }
  });

  const canShareFiles = !inClaude && typeof navigator.canShare === "function" && (() => {
    try { return navigator.canShare({ files: [new File([new Blob(["x"], { type: "image/jpeg" })], "t.jpg", { type: "image/jpeg" })] }); } catch (e) { return false; }
  })();
  shareBtn.hidden = !(app || canShareFiles);
  shareBtn.addEventListener("click", async () => {
    if (!src || busy) return;
    busy = true;
    try {
      if (app) {
        if (!savedUris) { savedUris = await saveInApp(); }
        if (!app.share(savedUris.join("\n"))) toast("Le partage n'a pas abouti. Les photos sont quand même dans la galerie.");
        return;
      }
      const [withF, withoutF] = await Promise.all([makeBlob(true), makeBlob(false)]);
      const names = fileNames();
      const files = [new File([withF], names.on, { type: "image/jpeg" }), new File([withoutF], names.off, { type: "image/jpeg" })];
      await navigator.share({ files, title: "Battle Pic" });
    } catch (e) {
      if (!e || e.name !== "AbortError") toast("Le partage n'a pas abouti. Utilise plutôt « Enregistrer ».");
    } finally { busy = false; }
  });

  /* ---------- Cycle de vie ---------- */
  /* Appelés par l'appli Android : bouton retour, mise en arrière-plan */
  window.battleBack = () => { if (closeTexts()) return true; if (mode === "review") { showShoot(); return true; } return false; };
  window.battlePause = () => { if (live) stopCamera(); };
  window.battleResume = () => { if (mode === "shoot" && wantLive && !live) startCamera(); };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (live) stopCamera(); }
    else if (mode === "shoot" && wantLive && !live) startCamera();
  });

  showShoot();
})();
</script>
