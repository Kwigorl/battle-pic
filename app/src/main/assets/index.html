<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Battle Pic</title>
<style>
@font-face { font-family: "Anton"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/anton-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/barlow-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Urbanist"; font-weight: 900; font-style: normal; font-display: swap; src: url("fonts/urbanist-latin-900-normal.woff2") format("woff2"); }
</style>
<style>
/* Layout : appli plein écran — en-tête, cadre 4:5 du post au centre, pupitre de commandes en bas */
:root {
  --ink: #121110;      /* fond, noir légèrement chaud */
  --deck: #1d1b19;     /* pupitre, cadre vide */
  --line: #34302b;     /* filets, contours */
  --fg: #f4f2ef;       /* texte */
  --muted: #aaa39a;    /* texte secondaire */
  --orange: #f7ab03;   /* éclair */
  --red: #fc0000;      /* case VS */
  --display: "Anton", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --box: "Urbanist", "Barlow", "Helvetica Neue", Arial, sans-serif; /* police des cases du visuel */
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.4; }
button, input, label { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;
}

/* En-tête */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 560px; width: 100%; margin-inline: auto; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .eyebrow { font-family: var(--display); color: var(--orange); font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
.brand .word { font-family: var(--display); font-size: 24px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
.brand .pic { color: var(--orange); }
.chip { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.live { color: var(--fg); }
.chip.live .dot { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 30%, transparent); }

/* Cadre */
.stage { min-height: 0; container-type: size; display: grid; place-items: center; }
.frame {
  position: relative;
  width: min(100cqw, 80cqh);
  height: min(100cqh, 125cqw);
  background: var(--deck);
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 0 0 1px var(--line);
  user-select: none;
  -webkit-user-select: none;
}
.frame.editing { touch-action: none; cursor: grab; }
.frame.editing:active { cursor: grabbing; }
.frame > video, .frame > canvas, .frame > .overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame > video { object-fit: cover; background: var(--ink); }
.frame > video.mirror { transform: scaleX(-1); }
.frame > .overlay { pointer-events: none; -webkit-user-drag: none; }
.frame > .texts { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: min(40cqh, 48cqw); color: var(--fg); text-shadow: 0 4px 30px rgba(0, 0, 0, 0.55); pointer-events: none; }
.flash { position: absolute; inset: 0; background: var(--fg); opacity: 0; pointer-events: none; }
.flash.on { animation: flash 420ms ease-out; }
@keyframes flash { from { opacity: 0.9; } to { opacity: 0; } }

/* Pupitre */
.deck { width: 100%; max-width: 560px; margin-inline: auto; display: grid; gap: 12px; }
.hint { margin: 0; text-align: center; color: var(--muted); font-size: 14px; text-wrap: balance; }
.row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.side { justify-self: center; display: grid; justify-items: center; gap: 4px; background: none; border: 0; padding: 4px 8px; border-radius: 10px; }
.side .ico { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--deck); border: 1px solid var(--line); }
.side svg { width: 24px; height: 24px; }
.side span { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.side:hover .ico { border-color: var(--muted); }
.shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid var(--fg); background: transparent; padding: 5px; display: grid; }
.shutter::after { content: ""; border-radius: 50%; background: var(--orange); transition: transform 120ms ease; }
.shutter:active::after { transform: scale(0.88); }
.shutter:disabled { opacity: 0.5; cursor: default; }

.seg { display: flex; justify-content: center; gap: 4px; }
.seg-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.seg-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.seg button { border: 1px solid var(--line); background: var(--deck); padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }

.zoom { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.zoom label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.zoom input { width: 100%; accent-color: var(--orange); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions > * { flex: 1 1 0; min-width: 0; }
.btn { border-radius: 12px; padding: 13px 14px; font-weight: 700; font-size: 15px; border: 1px solid var(--line); background: var(--deck); }
.btn.primary { flex-grow: 2; background: var(--orange); color: var(--ink); border-color: var(--orange); }
.btn:disabled { opacity: 0.6; cursor: default; }

.pill { justify-self: center; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--deck); border-radius: 999px; padding: 7px 16px 7px 12px; font-weight: 600; font-size: 14px; }
.pill .aa { font-family: var(--box); font-weight: 900; color: var(--orange); }
.pill:hover { border-color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.field .line { display: flex; gap: 12px; align-items: center; }
.field input[type="text"] { flex: 1 1 auto; min-width: 0; background: var(--deck); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--box); font-weight: 900; font-size: 16px; text-transform: uppercase; }
.field input[type="text"]::placeholder { color: var(--muted); opacity: 0.6; }
.field .size { flex: 0 0 104px; display: grid; gap: 2px; }
.field .size span { font-size: 11px; color: var(--muted); text-align: center; }
.field input[type="range"] { width: 100%; accent-color: var(--orange); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--ink); font-weight: 600; padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); text-align: center; opacity: 0; pointer-events: none; transition: opacity 200ms ease, transform 200ms ease; z-index: 20; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .flash.on { animation: none; }
  .toast, .shutter::after { transition: none; }
}
</style>
</head>

  const $ = (id) => document.getElementById(id);
  const frame = $("frame"), video = $("video"), photo = $("photo"), overlay = $("overlay");
  const countEl = $("count"), flashEl = $("flash"), chip = $("chip"), chipText = $("chipText");
  const deckShoot = $("deckShoot"), deckReview = $("deckReview"), hintShoot = $("hintShoot");
  const shutter = $("shutter"), flipBtn = $("flipBtn"), galleryBtn = $("galleryBtn"), timerWrap = $("timerWrap");
  const pickCamera = $("pickCamera"), pickGallery = $("pickGallery");
  const zoom = $("zoom"), saveBtn = $("saveBtn"), shareBtn = $("shareBtn"), retakeBtn = $("retakeBtn");
  const toastEl = $("toast");
  const textsCanvas = $("texts"), deckTexts = $("deckTexts");
  const txtLeft = $("txtLeft"), txtRight = $("txtRight"), sizeLeft = $("sizeLeft"), sizeRight = $("sizeRight");

  const inClaude = !!(window.claude && typeof window.claude.use === "function");
  const app = window.BattleApp || null; /* pont fourni par l'appli Android */
  const downloadsReady = inClaude ? Promise.resolve(window.claude.use("downloads")).catch(() => null) : Promise.resolve(null);

  let stream = null, facing = "environment", live = false, wantLive = true;
  let mode = "shoot", src = null, view = { z: 1, cx: W / 2, cy: H / 2 };
  let timer = 0, counting = false, wake = null, busy = false, savedUris = null;

  try { const t = parseInt(localStorage.getItem("battle-timer"), 10); if ([0, 3, 10].includes(t)) timer = t; } catch (e) {}

  /* ---------- Interface ---------- */
  function setChip(text, isLive) { chipText.textContent = text; chip.classList.toggle("live", !!isLive); }
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("on"), 3200);
  }
  function pressGroup(btns, attr, value) { btns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[attr] === String(value)))); }
  const timerBtns = [...timerWrap.querySelectorAll("button")];
  pressGroup(timerBtns, "timer", timer);
  timerBtns.forEach((b) => b.addEventListener("click", () => {
    timer = parseInt(b.dataset.timer, 10); pressGroup(timerBtns, "timer", timer);
    try { localStorage.setItem("battle-timer", String(timer)); } catch (e) {}
  }));
  const viewBtns = [...deckReview.querySelectorAll("[data-view]")];
  viewBtns.forEach((b) => b.addEventListener("click", () => {
    overlay.hidden = textsCanvas.hidden = b.dataset.view === "off"; pressGroup(viewBtns, "view", b.dataset.view);
  }));

  /* ---------- Textes des cases blanches ---------- */
  /* Zones mesurées sur le visuel d'origine (pixels du post 1080 × 1350), sans déborder sous la case VS */
  const BOXES = {
    left: { x0: 140, x1: 466, cx: 318.5, cy: 1208.5, h: 66 },
    right: { x0: 606, x1: 942, cx: 770, cy: 1285, h: 84 }
  };
  const BOX_SIZE = 42; /* taille d'origine : hauteur de capitale ~30 px */
  const BOX_FONT = '"Urbanist", "Barlow", "Helvetica Neue", Arial, sans-serif';
  let texts = { left: "", right: "", sizeLeft: 100, sizeRight: 100 };
  try { const t = JSON.parse(localStorage.getItem("battle-texts") || "null"); if (t && typeof t === "object") texts = Object.assign(texts, t); } catch (e) {}
  function saveTexts() { try { localStorage.setItem("battle-texts", JSON.stringify(texts)); } catch (e) {} }

  /* Une ligne si ça tient, sinon deux lignes équilibrées, sinon on réduit la taille */
  function layoutBox(ctx, text, box, scale) {
    const words = text.split(/\s+/).filter(Boolean);
    if (!words.length) return null;
    const maxW = box.x1 - box.x0;
    let size = BOX_SIZE * scale;
    for (let guard = 0; guard < 80 && size >= 10; guard++, size *= 0.96) {
      ctx.font = `900 ${size}px ${BOX_FONT}`;
      const cap = ctx.measureText("H").actualBoundingBoxAscent || size * 0.71;
      const pitch = size * 0.98;
      const options = [[words.join(" ")]];
      if (words.length > 1) {
        let best = null;
        for (let i = 1; i < words.length; i++) {
          const l = [words.slice(0, i).join(" "), words.slice(i).join(" ")];
          const w = Math.max(ctx.measureText(l[0]).width, ctx.measureText(l[1]).width);
          if (!best || w < best.w) best = { l, w };
        }
        options.push(best.l);
      }
      for (const lines of options) {
        const w = Math.max(...lines.map((s) => ctx.measureText(s).width));
        if (w <= maxW && cap + (lines.length - 1) * pitch <= box.h) return { lines, size, cap, pitch, w };
      }
    }
    return null;
  }
  function drawTexts() {
    const ctx = textsCanvas.getContext("2d");
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#000"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    for (const side of ["left", "right"]) {
      const box = BOXES[side];
      const scale = (side === "left" ? texts.sizeLeft : texts.sizeRight) / 100;
      const L = layoutBox(ctx, String(texts[side] || "").toLocaleUpperCase("fr-FR").trim(), box, scale);
      if (!L) continue;
      ctx.font = `900 ${L.size}px ${BOX_FONT}`;
      let cx = box.cx;
      if (cx - L.w / 2 < box.x0) cx = box.x0 + L.w / 2;
      if (cx + L.w / 2 > box.x1) cx = box.x1 - L.w / 2;
      const top = box.cy - (L.cap + (L.lines.length - 1) * L.pitch) / 2;
      L.lines.forEach((line, i) => ctx.fillText(line, cx, top + L.cap + i * L.pitch));
    }
    savedUris = null;
  }
  const textPills = [...document.querySelectorAll("[data-open-texts]")];
  function updatePills() {
    const filled = !!(String(texts.left).trim() || String(texts.right).trim());
    textPills.forEach((b) => { b.querySelector(".lbl").textContent = filled ? "Modifier les textes" : "Écrire dans les cases"; });
  }
  let deckBeforeTexts = null;
  function openTexts() {
    deckBeforeTexts = mode === "review" ? deckReview : deckShoot;
    deckBeforeTexts.hidden = true; deckTexts.hidden = false;
    overlay.hidden = textsCanvas.hidden = false; pressGroup(viewBtns, "view", "on");
    txtLeft.value = texts.left; txtRight.value = texts.right;
    sizeLeft.value = String(texts.sizeLeft); sizeRight.value = String(texts.sizeRight);
    txtLeft.focus();
  }
  function closeTexts() {
    if (deckTexts.hidden) return false;
    deckTexts.hidden = true;
    (mode === "review" ? deckReview : deckShoot).hidden = false;
    saveTexts(); updatePills();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    return true;
  }
  textPills.forEach((b) => b.addEventListener("click", openTexts));
  $("doneTexts").addEventListener("click", closeTexts);
  $("clearTexts").addEventListener("click", () => {
    texts = { left: "", right: "", sizeLeft: 100, sizeRight: 100 };
    txtLeft.value = txtRight.value = ""; sizeLeft.value = sizeRight.value = "100";
    drawTexts(); saveTexts(); txtLeft.focus();
  });
  txtLeft.addEventListener("input", () => { texts.left = txtLeft.value; drawTexts(); saveTexts(); });
  txtRight.addEventListener("input", () => { texts.right = txtRight.value; drawTexts(); saveTexts(); });
  sizeLeft.addEventListener("input", () => { texts.sizeLeft = parseInt(sizeLeft.value, 10) || 100; drawTexts(); saveTexts(); });
  sizeRight.addEventListener("input", () => { texts.sizeRight = parseInt(sizeRight.value, 10) || 100; drawTexts(); saveTexts(); });
  txtLeft.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); txtRight.focus(); } });
  txtRight.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); closeTexts(); } });
  updatePills();
  drawTexts();
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`900 ${BOX_SIZE}px "Urbanist"`).then(drawTexts, drawTexts);
    if (document.fonts.ready) document.fonts.ready.then(drawTexts);
  }

  function showShoot() {
    mode = "shoot"; src = null;
    deckReview.hidden = true; deckShoot.hidden = false;
    photo.hidden = true; overlay.hidden = textsCanvas.hidden = false; pressGroup(viewBtns, "view", "on");
    deckTexts.hidden = true;
    frame.classList.remove("editing"); frame.removeAttribute("tabindex");
    if (wantLive) startCamera(); else setFallbackUI();
  }
  function showReview() {
    mode = "review";
    stopCamera();
    video.hidden = true; photo.hidden = false;
    deckShoot.hidden = true; deckTexts.hidden = true; deckReview.hidden = false;
    frame.classList.add("editing"); frame.tabIndex = 0;
    setChip("Recadrage", false);
    zoom.value = String(view.z);
    render();
  }

  /* ---------- Caméra en direct ---------- */
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { wantLive = false; return setFallbackUI(); }
    try {
      stopCamera();
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1920 } }
      });
      if (mode !== "shoot") { stopCamera(); return; }
      video.srcObject = stream;
      video.classList.toggle("mirror", facing === "user");
      video.hidden = false;
      await video.play().catch(() => {});
      live = true;
      setChip("Viseur en direct", true);
      hintShoot.textContent = "Ce que tu vois est la photo finale : la photo remplace le vert.";
      timerWrap.hidden = false;
      requestWake();
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        flipBtn.hidden = devices.filter((d) => d.kind === "videoinput").length < 2;
      } catch (e) { flipBtn.hidden = true; }
    } catch (err) {
      live = false; wantLive = false;
      setFallbackUI(err);
    }
  }
  function stopCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; live = false; video.srcObject = null; video.hidden = true;
    releaseWake();
  }
  function setFallbackUI(err) {
    video.hidden = true; flipBtn.hidden = true; timerWrap.hidden = true;
    setChip("Photo", false);
    let msg = "Le bouton ouvre l'appareil photo. Le cadre se pose ensuite sur ta photo, que tu peux recadrer.";
    if (app) msg = "La caméra n'est pas autorisée. Autorise-la dans les réglages de l'appli, ou choisis une photo dans la galerie.";
    else if (err && err.name === "NotAllowedError" && !inClaude) msg = "Accès à la caméra refusé. Le bouton ouvre l'appareil photo du téléphone, le cadre se pose ensuite sur ta photo.";
    hintShoot.textContent = msg;
  }
  async function requestWake() {
    try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) { wake = null; }
  }
  function releaseWake() { if (wake) { wake.release().catch(() => {}); wake = null; } }

  flipBtn.addEventListener("click", () => { facing = facing === "user" ? "environment" : "user"; startCamera(); });

  /* Copie une image dans un canevas (réduit à 3200 px max), en miroir pour la caméra avant */
  function toCanvas(img, w, h, mirror) {
    const k = Math.min(1, 3200 / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
    const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
    if (mirror) { x.translate(c.width, 0); x.scale(-1, 1); }
    x.drawImage(img, 0, 0, c.width, c.height);
    return c;
  }
  /* Vraie photo du capteur (pleine résolution) quand le téléphone le permet */
  async function sensorPhoto(track, vw, vh) {
    if (typeof ImageCapture !== "function") return null;
    try {
      const ic = new ImageCapture(track);
      let settings;
      try {
        const caps = await ic.getPhotoCapabilities();
        if (caps && caps.imageWidth && caps.imageWidth.max && caps.imageHeight && caps.imageHeight.max) {
          settings = { imageWidth: caps.imageWidth.max, imageHeight: caps.imageHeight.max };
        }
      } catch (e) {}
      const blob = await ic.takePhoto(settings);
      const bmp = await createImageBitmap(blob);
      /* si la photo n'a pas la même orientation que le viseur, on garde l'image du viseur */
      if ((bmp.width > bmp.height) !== (vw > vh) || bmp.width < vw) { if (bmp.close) bmp.close(); return null; }
      const c = toCanvas(bmp, bmp.width, bmp.height, facing === "user");
      if (bmp.close) bmp.close();
      return c;
    } catch (e) { return null; }
  }
  /* Zoom de départ pour que la photo montre le même champ que le viseur */
  function zoomMatchingPreview(pw, ph, vw, vh) {
    const va = vw / vh, fa = W / H;
    const rw = pw / ph > va ? ph * va : pw;            /* zone de la photo qui correspond au flux vidéo */
    const visW = va > fa ? vh * fa : vw;               /* largeur du flux visible dans le cadre */
    const shownW = visW * (rw / vw);                   /* … ramenée en pixels de la photo */
    const cover = Math.max(W / pw, H / ph);
    return Math.min(4, Math.max(1, (W / shownW) / cover));
  }
  async function takeLivePhoto() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const track = stream && stream.getVideoTracks()[0];
    if (!vw || !vh || !track) { toast("La caméra n'est pas encore prête. Réessaie dans une seconde."); return; }
    flashEl.classList.remove("on"); void flashEl.offsetWidth; flashEl.classList.add("on");
    shutter.disabled = true; setChip("Prise de vue…", true);
    const fallback = toCanvas(video, vw, vh, facing === "user");
    const full = await sensorPhoto(track, vw, vh);
    shutter.disabled = false;
    if (mode !== "shoot") return;
    if (full) setSource(full, zoomMatchingPreview(full.width, full.height, vw, vh));
    else setSource(fallback);
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function countdown(n) {
    counting = true; shutter.disabled = true; countEl.hidden = false;
    for (let i = n; i > 0; i--) { countEl.textContent = String(i); await wait(1000); if (mode !== "shoot" || !live) break; }
    countEl.hidden = true; shutter.disabled = false; counting = false;
  }
  shutter.addEventListener("click", async () => {
    if (counting) return;
    if (!live) { pickCamera.value = ""; pickCamera.click(); return; }
    if (timer > 0) { await countdown(timer); if (mode !== "shoot" || !live) return; }
    takeLivePhoto();
  });
  galleryBtn.addEventListener("click", () => { pickGallery.value = ""; pickGallery.click(); });

  /* ---------- Photo importée ---------- */
  function decodeWithImg(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }
  async function loadFile(file) {
    if (!file) return;
    try {
      let bmp;
      try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
      catch (e) { bmp = await decodeWithImg(file); }
      const w = bmp.naturalWidth || bmp.width, h = bmp.naturalHeight || bmp.height;
      const k = Math.min(1, 3200 / Math.max(w, h));
      const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
      const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(bmp, 0, 0, c.width, c.height);
      if (bmp.close) bmp.close();
      setSource(c);
    } catch (e) {
      toast("Cette photo n'a pas pu être ouverte. Essaie avec une photo JPEG ou PNG.");
    }
  }
  pickCamera.addEventListener("change", () => loadFile(pickCamera.files[0]));
  pickGallery.addEventListener("change", () => loadFile(pickGallery.files[0]));

  /* ---------- Recadrage ---------- */
  function setSource(c, z) { src = c; view = { z: z || 1, cx: W / 2, cy: H / 2 }; showReview(); }
  function geom() { const s = Math.max(W / src.width, H / src.height) * view.z; return { s, dw: src.width * s, dh: src.height * s }; }
  function clampView() {
    const { dw, dh } = geom();
    view.cx = Math.min(dw / 2, Math.max(W - dw / 2, view.cx));
    view.cy = Math.min(dh / 2, Math.max(H - dh / 2, view.cy));
  }
  function drawPhoto(ctx) {
    const { dw, dh } = geom();
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, view.cx - dw / 2, view.cy - dh / 2, dw, dh);
  }
  let raf = 0;
  function render() { savedUris = null; if (raf || !src) return; raf = requestAnimationFrame(() => { raf = 0; if (src) drawPhoto(photo.getContext("2d")); }); }
  function zoomAt(mx, my, z) {
    const old = geom().s;
    view.z = Math.min(4, Math.max(1, z));
    const ns = geom().s;
    view.cx = mx + (view.cx - mx) * (ns / old);
    view.cy = my + (view.cy - my) * (ns / old);
    clampView(); zoom.value = String(view.z); render();
  }
  function toOut(clientX, clientY) {
    const r = frame.getBoundingClientRect();
    return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height), k: W / r.width };
  }
  const pts = new Map();
  frame.addEventListener("pointerdown", (e) => {
    if (mode !== "review") return;
    frame.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  });
  frame.addEventListener("pointermove", (e) => {
    if (mode !== "review" || !pts.has(e.pointerId)) return;
    const before = [...pts.values()].map((p) => ({ ...p }));
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const after = [...pts.values()];
    if (after.length === 1) {
      const k = toOut(0, 0).k;
      view.cx += (after[0].x - before[0].x) * k; view.cy += (after[0].y - before[0].y) * k;
      clampView(); render();
    } else if (after.length >= 2) {
      const mid = (a) => ({ x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 });
      const dist = (a) => Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
      const m0 = mid(before), m1 = mid(after), k = toOut(0, 0).k;
      view.cx += (m1.x - m0.x) * k; view.cy += (m1.y - m0.y) * k;
      const m = toOut(m1.x, m1.y);
      zoomAt(m.x, m.y, view.z * dist(after) / dist(before));
    }
  });
  const endPointer = (e) => { pts.delete(e.pointerId); };
  frame.addEventListener("pointerup", endPointer);
  frame.addEventListener("pointercancel", endPointer);
  frame.addEventListener("wheel", (e) => {
    if (mode !== "review") return;
    e.preventDefault();
    const m = toOut(e.clientX, e.clientY);
    zoomAt(m.x, m.y, view.z * Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
  frame.addEventListener("keydown", (e) => {
    if (mode !== "review") return;
    const step = e.shiftKey ? 60 : 20;
    const moves = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
    if (moves[e.key]) { e.preventDefault(); view.cx += moves[e.key][0]; view.cy += moves[e.key][1]; clampView(); render(); }
  });
  zoom.addEventListener("input", () => zoomAt(W / 2, H / 2, parseFloat(zoom.value)));

  retakeBtn.addEventListener("click", showShoot);

  /* ---------- Export ---------- */
  function makeBlob(withOverlay) {
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d");
    drawPhoto(x);
    if (withOverlay) { x.drawImage(overlay, 0, 0, W, H); x.drawImage(textsCanvas, 0, 0, W, H); }
    return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("export"))), "image/jpeg", 0.92));
  }
  function fileNames() {
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    const stamp = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}-${p(d.getSeconds())}`;
    return { on: `la-battle_${stamp}_avec-filtre.jpg`, off: `la-battle_${stamp}_sans-filtre.jpg` };
  }
  async function saveWith(downloads, filename, data) {
    try { return await downloads.save({ filename, data }); }
    catch (e) {
      if (e && e.code === "rate_limited") { await wait(1500); return downloads.save({ filename, data }); }
      throw e;
    }
  }
  function linkDownload(blob, name) {
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(",")[1] || "");
      r.onerror = () => rej(new Error("lecture"));
      r.readAsDataURL(blob);
    });
  }
  /* Appli Android : les 2 photos vont dans la galerie, album « La Battle » */
  async function saveInApp() {
    await overlay.decode().catch(() => {});
    const [withF, withoutF] = await Promise.all([makeBlob(true), makeBlob(false)]);
    const names = fileNames();
    const u1 = app.saveImage(await blobToBase64(withF), names.on);
    if (!u1) throw new Error("save");
    const u2 = app.saveImage(await blobToBase64(withoutF), names.off);
    if (!u2) { const e = new Error("save"); e.partial = true; throw e; }
    return [u1, u2];
  }
  saveBtn.addEventListener("click", async () => {
    if (!src || busy) return;
    busy = true; saveBtn.disabled = true; const label = saveBtn.textContent; saveBtn.textContent = "Préparation…";
    let saved = 0;
    try {
      if (app) {
        const uris = await saveInApp();
        savedUris = uris;
        toast("Les 2 photos sont dans la galerie, album « Battle Pic ».");
        return;
      }
      await overlay.decode().catch(() => {});
      const [withF, withoutF] = await Promise.all([makeBlob(true), makeBlob(false)]);
      const names = fileNames();
      if (inClaude) {
        const downloads = await downloadsReady;
        if (!downloads) { toast("L'enregistrement n'est pas disponible sur cette page."); return; }
        saveBtn.textContent = "Photo avec filtre…";
        await saveWith(downloads, names.on, withF); saved++;
        saveBtn.textContent = "Photo sans filtre…";
        await saveWith(downloads, names.off, withoutF); saved++;
        toast("Les 2 photos sont enregistrées.");
      } else {
        linkDownload(withF, names.on); saved++;
        await wait(500);
        linkDownload(withoutF, names.off); saved++;
        toast("Les 2 photos sont dans tes téléchargements.");
      }
    } catch (e) {
      const code = e && e.code;
      if (saved === 1 || (e && e.partial)) toast("Seule la photo avec filtre a été enregistrée.");
      else if (code === "declined") toast("Enregistrement annulé.");
      else toast("L'enregistrement n'a pas abouti. Réessaie dans un instant.");
    } finally {
      busy = false; saveBtn.disabled = false; saveBtn.textContent = label;
    }
  });

  const canShareFiles = !inClaude && typeof navigator.canShare === "function" && (() => {
    try { return navigator.canShare({ files: [new File([new Blob(["x"], { type: "image/jpeg" })], "t.jpg", { type: "image/jpeg" })] }); } catch (e) { return false; }
  })();
  shareBtn.hidden = !(app || canShareFiles);
  shareBtn.addEventListener("click", async () => {
    if (!src || busy) return;
    busy = true;
    try {
      if (app) {
        if (!savedUris) { savedUris = await saveInApp(); }
        if (!app.share(savedUris.join("\n"))) toast("Le partage n'a pas abouti. Les photos sont quand même dans la galerie.");
        return;
      }
      const [withF, withoutF] = await Promise.all([makeBlob(true), makeBlob(false)]);
      const names = fileNames();
      const files = [new File([withF], names.on, { type: "image/jpeg" }), new File([withoutF], names.off, { type: "image/jpeg" })];
      await navigator.share({ files, title: "Battle Pic" });
    } catch (e) {
      if (!e || e.name !== "AbortError") toast("Le partage n'a pas abouti. Utilise plutôt « Enregistrer ».");
    } finally { busy = false; }
  });

  /* ---------- Cycle de vie ---------- */
  /* Appelés par l'appli Android : bouton retour, mise en arrière-plan */
  window.battleBack = () => { if (closeTexts()) return true; if (mode === "review") { showShoot(); return true; } return false; };
  window.battlePause = () => { if (live) stopCamera(); };
  window.battleResume = () => { if (mode === "shoot" && wantLive && !live) startCamera(); };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (live) stopCamera(); }
    else if (mode === "shoot" && wantLive && !live) startCamera();
  });

  showShoot();
})();
</script>
